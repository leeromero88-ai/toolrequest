<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolRequest</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.card{background:#fff;max-width:600px;margin:0 auto;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h1{margin:0}.orange{color:#ea580c}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{background:#111;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-size:16px}
.urgent{background:#fee2e2;border-left:5px solid red;padding:10px;margin:10px 0;border-radius:8px}
.item{background:#f9f9f9;padding:12px;margin:10px 0;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h1>Tool<span class="orange">Request</span></h1>
<p>Request tools without verbal requests. Nothing gets lost.</p>
<h3>New Request</h3>
<input id="who" placeholder="Who is requesting? e.g. Lee">
<input id="tool" placeholder="What tool? e.g. Torque wrench">
<input id="job" placeholder="For what job?">
<select id="urgency"><option>Normal</option><option>Urgent</option><option>URGENT - WORK STOPPED</option></select>
<button onclick="add()">Create Request</button>
<div id="list"></div>
<p style="font-size:12px;color:#666">Languages: English | Español | Kreyòl | Français - Worker requests in their language, supervisor sees it in theirs. | Pilot v1 by Lee Romero</p>
</div>
<script>
function add(){
let t=document.getElementById('tool').value;
let w=document.getElementById('who').value||'Worker';
let j=document.getElementById('job').value||'';
let u=document.getElementById('urgency').value;
if(!t){alert('Write what tool you need');return}
let d=document.createElement('div');
d.className=u.includes('WORK STOPPED')?'urgent':'item';
d.innerHTML='<b>'+t+'</b> - '+w+'<br>'+j+'<br><small>'+u+' - '+new Date().toLocaleString()+'</small>';
document.getElementById('list').prepend(d);
document.getElementById('tool').value='';
}
</script>
</body>
</html>
